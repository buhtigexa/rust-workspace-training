[package]
name = "crud"
version = "0.1.0"
edition = "2021"

[dependencies]  
tokio = { version = "1.36.0", features = ["full"] }
axum = "0.7.4"
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.113"
sqlx = { version = "0.7.3", features = ["mysql", "macros", "runtime-tokio-native-tls"] }
dotenv = "0.15.0"
